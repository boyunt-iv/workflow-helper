<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace Footer Viewer</title>
<style>
:root {
color-scheme: light;
--bg: #f6f8fb;
--panel: #ffffff;
--border: #d8e0ea;
--text: #111827;
--muted: #6b7280;
--primary: #1d4ed8;
--ok: #047857;
--warn: #b45309;
--error: #b91c1c;
}
* {
box-sizing: border-box;
}
body {
margin: 0;
min-height: 100vh;
background: var(--bg);
color: var(--text);
font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main {
width: min(920px, calc(100vw - 32px));
margin: 0 auto;
padding: 32px 0;
}
h1 {
margin: 0 0 6px;
font-size: 24px;
line-height: 1.2;
}
p {
margin: 0;
color: var(--muted);
}
.drop-zone {
margin-top: 24px;
padding: 28px;
border: 2px dashed var(--border);
border-radius: 8px;
background: var(--panel);
text-align: center;
transition: border-color 0.15s ease, background 0.15s ease;
}
.drop-zone.dragging {
border-color: var(--primary);
background: #eff6ff;
}
input[type="file"] {
margin-top: 16px;
}
.status {
margin-top: 18px;
padding: 12px 14px;
border: 1px solid var(--border);
border-radius: 8px;
background: var(--panel);
color: var(--muted);
font-size: 14px;
}
.status.ok {
border-color: #a7f3d0;
color: var(--ok);
background: #ecfdf5;
}
.status.warn {
border-color: #fde68a;
color: var(--warn);
background: #fffbeb;
}
.status.error {
border-color: #fecaca;
color: var(--error);
background: #fef2f2;
}
.grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 12px;
margin-top: 18px;
}
.field {
min-height: 82px;
padding: 12px;
border: 1px solid var(--border);
border-radius: 8px;
background: var(--panel);
}
.field span {
display: block;
margin-bottom: 8px;
color: var(--muted);
font-size: 12px;
font-weight: 700;
letter-spacing: 0.02em;
text-transform: uppercase;
}
.field strong {
display: block;
overflow-wrap: anywhere;
font-size: 15px;
line-height: 1.4;
}
pre {
overflow: auto;
max-height: 360px;
margin: 18px 0 0;
padding: 14px;
border: 1px solid var(--border);
border-radius: 8px;
background: #0f172a;
color: #e5e7eb;
font-size: 13px;
line-height: 1.5;
}
.actions {
display: flex;
gap: 8px;
margin-top: 12px;
}
button {
border: 1px solid var(--border);
border-radius: 8px;
background: var(--panel);
color: var(--text);
cursor: pointer;
font: inherit;
padding: 8px 12px;
}
button:hover {
border-color: var(--primary);
color: var(--primary);
}
</style>
</head>
<body>
<main>
<h1>Trace Footer Viewer</h1>
<p>Open a Live API trace export and read the hidden access footer without changing the JSON file.</p>
<section class="drop-zone" id="dropZone">
<strong>Drop trace JSON here</strong>
<p>or browse from your computer</p>
<input id="fileInput" type="file" accept=".json,application/json">
</section>
<div id="status" class="status">Select a trace JSON file to inspect.</div>
<section class="grid" id="summary" hidden>
<div class="field">
<span>Access Name</span>
<strong id="accessName">-</strong>
</div>
<div class="field">
<span>Index File</span>
<strong id="indexFileName">-</strong>
</div>
<div class="field">
<span>Process Count</span>
<strong id="processCount">-</strong>
</div>
<div class="field">
<span>Exported At</span>
<strong id="exportedAt">-</strong>
</div>
</section>
<div class="actions" id="actions" hidden>
<button id="copyMetadata" type="button">Copy metadata</button>
</div>
<pre id="rawMetadata" hidden></pre>
</main>
<script>
(function () {
"use strict";
const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");
const status = document.getElementById("status");
const summary = document.getElementById("summary");
const actions = document.getElementById("actions");
const rawMetadata = document.getElementById("rawMetadata");
const copyMetadata = document.getElementById("copyMetadata");
const fields = {
accessName: document.getElementById("accessName"),
indexFileName: document.getElementById("indexFileName"),
processCount: document.getElementById("processCount"),
exportedAt: document.getElementById("exportedAt"),
};
let currentMetadata = null;
function setStatus(message, tone) {
status.textContent = message;
status.className = `status ${tone || ""}`.trim();
}
function resetResult() {
currentMetadata = null;
summary.hidden = true;
actions.hidden = true;
rawMetadata.hidden = true;
rawMetadata.textContent = "";
}
function findJsonEnd(text) {
let start = -1;
for (let index = 0; index < text.length; index += 1) {
if (!/\s/.test(text[index])) {
start = index;
break;
}
}
if (start < 0) throw new Error("File is empty.");
const opener = text[start];
const closer = opener === "[" ? "]" : opener === "{" ? "}" : "";
if (!closer) throw new Error("File does not start with a JSON object or array.");
let depth = 0;
let inString = false;
let escaped = false;
for (let index = start; index < text.length; index += 1) {
const char = text[index];
if (inString) {
if (escaped) {
escaped = false;
} else if (char === "\\") {
escaped = true;
} else if (char === "\"") {
inString = false;
}
continue;
}
if (char === "\"") {
inString = true;
} else if (char === "{" || char === "[") {
depth += 1;
} else if (char === "}" || char === "]") {
depth -= 1;
if (depth === 0) return index + 1;
if (depth < 0) throw new Error("Invalid JSON structure.");
}
}
throw new Error("JSON value is incomplete.");
}
function decodeFooter(text) {
const jsonEnd = findJsonEnd(text);
const footer = text.slice(jsonEnd);
const bits = [];
for (const char of footer) {
if (char === " ") bits.push("0");
else if (char === "\t") bits.push("1");
else if (char === "\r" || char === "\n") continue;
else throw new Error("Unexpected non-whitespace data after the JSON value.");
}
if (bits.length < 32) throw new Error("No hidden footer found.");
const bytes = [];
for (let index = 0; index + 7 < bits.length; index += 8) {
bytes.push(parseInt(bits.slice(index, index + 8).join(""), 2));
}
if (bytes.length < 4) throw new Error("Hidden footer is incomplete.");
const length = new DataView(new Uint8Array(bytes.slice(0, 4)).buffer).getUint32(0, false);
if (length < 2 || bytes.length < 4 + length) {
throw new Error("Hidden footer length is invalid.");
}
const payload = new Uint8Array(bytes.slice(4, 4 + length));
return JSON.parse(new TextDecoder().decode(payload));
}
function renderMetadata(metadata, fileName, itemCount) {
currentMetadata = metadata;
fields.accessName.textContent = metadata._AccessName || "-";
fields.indexFileName.textContent = metadata._IndexFileName || "-";
fields.processCount.textContent = String(metadata.processCount ?? itemCount ?? "-");
fields.exportedAt.textContent = metadata.exportedAt || "-";
rawMetadata.textContent = JSON.stringify(metadata, null, 2);
summary.hidden = false;
actions.hidden = false;
rawMetadata.hidden = false;
setStatus(`Hidden footer found in ${fileName}.`, "ok");
}
async function inspectFile(file) {
resetResult();
if (!file) return;
setStatus(`Reading ${file.name}...`);
try {
const text = await file.text();
const parsed = JSON.parse(text);
const itemCount = Array.isArray(parsed)
? parsed.length
: Array.isArray(parsed && parsed.Items)
? parsed.Items.length
: null;
const metadata = decodeFooter(text);
renderMetadata(metadata, file.name, itemCount);
} catch (error) {
const message = error && error.message ? error.message : "Unable to inspect the file.";
setStatus(message === "No hidden footer found."
? "No hidden footer found. The JSON data may still be valid, but no access metadata was detected."
: message, message === "No hidden footer found." ? "warn" : "error");
}
}
fileInput.addEventListener("change", () => {
inspectFile(fileInput.files && fileInput.files[0]);
});
dropZone.addEventListener("dragover", (event) => {
event.preventDefault();
dropZone.classList.add("dragging");
});
dropZone.addEventListener("dragleave", () => {
dropZone.classList.remove("dragging");
});
dropZone.addEventListener("drop", (event) => {
event.preventDefault();
dropZone.classList.remove("dragging");
const file = event.dataTransfer.files && event.dataTransfer.files[0];
if (file) inspectFile(file);
});
copyMetadata.addEventListener("click", async () => {
if (!currentMetadata) return;
try {
await navigator.clipboard.writeText(JSON.stringify(currentMetadata, null, 2));
setStatus("Metadata copied.", "ok");
} catch (_) {
setStatus("Unable to copy metadata in this browser.", "warn");
}
});
})();
</script>
</body>
</html>
